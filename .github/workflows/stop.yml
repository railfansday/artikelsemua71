name: Finalize and Push Articles

on:
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions di GitHub

# Tambahkan blok permissions ini agar GitHub Actions bot punya hak akses tulis
permissions:
  contents: write

jobs:
  push_final_articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure Git Identity
        run: |
          git config --global user.name "railfansday"
          git config --global user.email "railfansday@users.noreply.github.io"

      - name: Add and Commit Final Articles
        run: |
          git add .
          git commit -m "Finalize repository: reached target monograph limit" || echo "No changes to commit"

      - name: Push to GitHub Pages
        run: |
          git push origin main

name: Stop and Push Current Articles

on:
  workflow_dispatch: # Bisa diklik manual dari tab Actions di GitHub

permissions:
  contents: write

jobs:
  finalize_repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure Git Identity
        run: |
          git config --global user.name "railfansday"
          git config --global user.email "railfansday@users.noreply.github.io"

      - name: Add, Commit and Push Current Progress
        run: |
          git add .
          git commit -m "Stop and finalize articles at current generated count" || echo "No changes to commit"
          git push origin main

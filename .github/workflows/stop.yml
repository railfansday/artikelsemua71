name: Finalize and Push Articles (21k+)

on:
  workflow_dispatch: # Bisa dijalankan manual kapan saja dari tab Actions di GitHub

# Memberikan izin tulis (write permissions) agar bot tidak terkena error 403 / permission denied
permissions:
  contents: write

jobs:
  push_final_articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure Git Identity
        run: |
          git config --global user.name "railfansday"
          git config --global user.email "railfansday@users.noreply.github.io"

      - name: Add and Commit Articles
        run: |
          git add .
          git commit -m "Finalize repository: reached ~21k+ articles limit" || echo "No changes to commit"

      - name: Push to GitHub Pages
        run: |
          git push origin main
